name: Build Perflyst SmartTV folder

on:
  schedule:
    - cron: "17 3 * * *"   # daily; Perflyst updates are occasional
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-smarttv-folder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build merged folder
        run: python3 scripts/build_smarttv_folder.py -o folders/perflyst-smarttv-folder.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- folders/perflyst-smarttv-folder.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add folders/perflyst-smarttv-folder.json
          git commit -m "Update Perflyst SmartTV folder"
          git push
