name: Build ControlD folders

on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-controld-folders
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build folders
        run: python3 scripts/build_folders.py folders

      - name: Commit if changed
        run: |
          git add folders/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ControlD folders"
          git push
