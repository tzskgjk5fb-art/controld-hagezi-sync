# =============================================================================
# ControlD Hagezi Sync — Configuration
# =============================================================================
# DO NOT put your API token in this file — it lives in the CONTROLD_API_TOKEN
# GitHub secret.
# =============================================================================

[settings]
api_token = ""

# Uncomment to skip the upstream freshness report at the end of each sync run.
# show_freshness = false

# Set to true to preview changes without modifying anything.
dry_run = false

[profiles]
names = ["Privacy Profile"]

[folders]
"SmartTV Combined"      = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/perflyst-smarttv-folder.json"
"Android Tracking"      = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/android-tracking-folder.json"
"Game Console"          = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/game-console-folder.json"
"AdGuard CNAME Targets" = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/adguard-cname-targets-folder.json"
# Optional - likely to break some Samsung/LG/Roku features:
"BlocklistProject SmartTV" = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/blocklistproject-smarttv-folder.json"
"Stalkerware Indicators" = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/stalkerware-folder.json"
"AdGuard DNS Popup"      = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/adguard-dns-popup-folder.json"
"HaGeZi DoH Bypass"      = "https://raw.githubusercontent.com/tzskgjk5fb-art/controld-hagezi-sync/main/folders/hagezi-doh-folder.json"

[profile_folders]
"Privacy Profile" = ["SmartTV Combined", "Android Tracking", "Game Console", "AdGuard CNAME Targets", "BlocklistProject SmartTV", "Stalkerware Indicators", "AdGuard DNS Popup", "HaGeZi DoH Bypass"]
